<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Control Stock - Sector Frío</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <header>
        <h1>🧀 Control Stock</h1>
        <p>Sector Frío</p>
    </header>

    <main>

        <!-- MENÚ -->
        <div class="menu">

            <button onclick="mostrarSeccion('ingreso')">
                📥 Ingreso
            </button>

            <button onclick="mostrarSeccion('egreso')">
                📤 Egreso
            </button>

            <button onclick="mostrarSeccion('stock')">
                📊 Stock
            </button>

        </div>


        <!-- INGRESO -->

        <section id="ingreso" class="seccion">

            <h2>📥 Ingresar mercadería</h2>

            <label>Producto</label>

            <input
                type="text"
                id="productoIngreso"
                placeholder="Ej: Lactear Cremoso"
            >


            <label>Cantidad de cajas</label>

            <input
                type="number"
                id="cajasIngreso"
                min="0"
            >


            <label>Hormas por caja</label>

            <input
                type="number"
                id="hormasIngreso"
                min="1"
            >


            <label>Peso por horma (kg)</label>

            <input
                type="number"
                id="pesoIngreso"
                step="0.001"
                min="0"
            >


            <button class="boton-principal" onclick="ingresarProducto()">
                ➕ Agregar ingreso
            </button>

        </section>


        <!-- EGRESO -->

        <section id="egreso" class="seccion oculto">

            <h2>📤 Registrar egreso</h2>

            <label>Producto</label>

            <input
                type="text"
                id="productoEgreso"
                placeholder="Ej: Lactear Cremoso"
            >


            <label>Cantidad de hormas que salen</label>

            <input
                type="number"
                id="hormasEgreso"
                min="1"
            >


            <button class="boton-principal" onclick="egresarProducto()">
                ➖ Registrar egreso
            </button>

        </section>


        <!-- STOCK -->

        <section id="stock" class="seccion oculto">

            <h2>📊 Stock actual</h2>

            <input
                type="text"
                id="buscador"
                placeholder="🔎 Buscar producto..."
                oninput="mostrarStock()"
            >

            <div id="listaStock"></div>

        </section>

    </main>


    <script src="app.js"></script>

</body>
</html>
